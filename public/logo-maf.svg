<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" fill="none">
  <defs>
    <linearGradient id="chromeBody" x1="12" y1="8" x2="220" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#d9dde5"/>
      <stop offset="48%" stop-color="#8f959f"/>
      <stop offset="72%" stop-color="#e9ebf0"/>
      <stop offset="100%" stop-color="#a7adb8"/>
    </linearGradient>
    <linearGradient id="chromeEdge" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2c2f36" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="depth" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g filter="url(#depth)">
    <!-- M -->
    <path
      d="M14 98 V22 H40 L60 62 L80 22 H106 V98 H82 V48 L66 82 H54 L38 48 V98 Z"
      fill="url(#chromeBody)"
      stroke="url(#chromeEdge)"
      stroke-width="1.4"
      stroke-linejoin="round"
    />
    <!-- A (arrow peak sharing visual weight with M) -->
    <path
      d="M106 98 V22 H132 L168 78 V22 H192 V98 H164 L128 42 V98 Z"
      fill="url(#chromeBody)"
      stroke="url(#chromeEdge)"
      stroke-width="1.4"
      stroke-linejoin="round"
    />
    <!-- F as two chrome bars -->
    <rect x="204" y="22" width="28" height="18" rx="2" fill="url(#chromeBody)" stroke="url(#chromeEdge)" stroke-width="1.2"/>
    <rect x="204" y="52" width="28" height="18" rx="2" fill="url(#chromeBody)" stroke="url(#chromeEdge)" stroke-width="1.2"/>
  </g>
</svg>
